[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-giggy"
version = "0.1.0"
description = "Giggy HTTP text-to-speech integration for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
license-files = ["LICENSE"]
authors = [{name = "Giggy", email = "henry@giggy.ai"}]
dependencies = ["pipecat-ai==1.12.0", "aiohttp>=3.11,<4"]
classifiers = ["Programming Language :: Python :: 3", "Framework :: AsyncIO"]

[project.urls]
Homepage = "https://giggy.ai"
Repository = "https://github.com/giggy-ai/pipecat-giggy"
Issues = "https://github.com/giggy-ai/pipecat-giggy/issues"
Documentation = "https://giggy.ai/docs/speech-api"
Changelog = "https://github.com/giggy-ai/pipecat-giggy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipecat_giggy = ["py.typed"]
