name: Voice sandbox checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[sandbox,test]'
      - run: python -m unittest discover -s examples/voice-agent-sandbox -p test_sandbox.py -v
      - run: python -m pytest tests -q
      - run: python -m compileall -q src examples/voice-agent-sandbox
